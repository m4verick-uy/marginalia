<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marginaLia</title>
<script>
  (function () {
    var theme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  * { box-sizing: border-box; }

  :root {
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

    --bg: #0b0b0d;
    --surface: #16161a;
    --border: #26262b;
    --text: #ececec;
    --text-dim: #9a9a9f;
    --accent: #6d8cff;
    --accent-contrast: #05060f;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 999px;
  }

  html[data-theme="light"] {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e2e2e5;
    --text: #16161a;
    --text-dim: #6b6b70;
    --accent: #3a5cff;
    --accent-contrast: #ffffff;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.5;
  }

  #login, #app { display: none; }

  /* ── Login screen ── */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .login-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 3rem 2.5rem;
    text-align: center;
    max-width: 340px;
    width: 100%;
  }

  .login-title {
    font-size: 1.6rem;
    font-weight: 500;
    margin: 0 0 0.75rem;
    color: var(--accent);
  }

  .login-sub {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-dim);
    margin: 0 0 2rem;
  }

  .login-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
    justify-content: center;
  }

  .login-btn:hover { background: var(--border); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ── App header ── */
  header {
    padding: 1.25rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 8px;
  }

  .app-title {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent);
    margin: 0;
  }

  .user-info {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
  }

  .theme-btn {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
    transition: color 0.12s;
  }
  .theme-btn:hover { color: var(--accent); }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--border);
  }

  .user-name {
    font-size: 13px;
    color: var(--text-dim);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .logout-btn {
    font-size: 12px;
    font-family: var(--font);
    padding: 0;
    border: none;
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.12s;
  }
  .logout-btn:hover { color: var(--accent); }

  main {
    padding: 1.5rem;
    max-width: 680px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="login-screen">
  <div class="login-card">
    <h1 class="login-title">marginaLia</h1>
    <p class="login-sub" id="login-sub">Tu bitácora de lectura personal.</p>
    <button class="login-btn" id="login-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continuar con Google
    </button>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="header-top">
      <h1 class="app-title">marginaLia</h1>
      <div class="user-info">
        <button class="theme-btn" id="theme-btn" aria-label="Cambiar tema" type="button"></button>
        <img id="user-avatar" class="avatar" src="" alt="" />
        <span class="user-name" id="user-name"></span>
        <button class="logout-btn" id="logout-btn" type="button">salir</button>
      </div>
    </div>
  </header>
  <main>
    <!-- Próxima feature vía Orchestrator: alta manual de libro + lista con filtros -->
  </main>
</div>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDrIMt-OByOww61cU3GwRe9HmXz-88tc0g",
  authDomain: "marginalia-68e0a.firebaseapp.com",
  projectId: "marginalia-68e0a",
  storageBucket: "marginalia-68e0a.firebasestorage.app",
  messagingSenderId: "1064022524675",
  appId: "1:1064022524675:web:c41eee84a99aa72d6a5f36"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Handle redirect result on page load ─────────────────────────
getRedirectResult(auth).catch(err => {
  if (err.code && err.code !== 'auth/no-auth-event') {
    console.error('Redirect error:', err.code, err.message);
    const sub = document.getElementById('login-sub');
    sub.textContent = `Error: ${err.code}`;
    sub.style.color = '#ff375f';
  }
});

// ── Auth state ──────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-avatar').src = user.photoURL || '';
    document.getElementById('user-name').textContent = user.displayName || user.email || '';
  } else {
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('user-avatar').src = '';
    document.getElementById('user-name').textContent = '';
  }
});

// ── Auth actions ─────────────────────────────────────────────────
async function login() {
  const provider = new GoogleAuthProvider();
  const btn = document.getElementById('login-btn');
  const sub = document.getElementById('login-sub');
  btn.disabled = true;
  sub.textContent = 'Conectando...';
  sub.style.color = '';
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    btn.disabled = false;
    if (err.code === 'auth/popup-blocked') {
      sub.textContent = 'Popup bloqueado, redirigiendo a Google...';
      await signInWithRedirect(auth, provider);
    } else if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
      sub.textContent = 'Cerraste el popup. Intentá de nuevo.';
      sub.style.color = 'var(--text-dim)';
    } else {
      sub.textContent = `Error: ${err.code}`;
      sub.style.color = '#ff375f';
      console.error('Login error:', err.code, err.message);
    }
  }
}

async function logout() {
  await signOut(auth);
}

// ── XSS sanitization ────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Event wiring ─────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('logout-btn').addEventListener('click', logout);

// ── Theme toggle ─────────────────────────────────────────────────
const SUN  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function updateThemeBtn() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.getElementById('theme-btn').innerHTML = isDark ? SUN : MOON;
}

function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeBtn();
}

updateThemeBtn();
document.getElementById('theme-btn').addEventListener('click', toggleTheme);
</script>

</body>
</html>
