<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marginaLia</title>
<script>
  (function () {
    var theme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  * { box-sizing: border-box; }

  :root {
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

    --bg: #0b0b0d;
    --surface: #16161a;
    --border: #26262b;
    --text: #ececec;
    --text-dim: #9a9a9f;
    --accent: #6d8cff;
    --accent-contrast: #05060f;
    --danger: #ff375f;
    --success: #30d158;
    --warning: #ffd60a;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 999px;

    /* Paleta de área — mapeo por índice (ver areaColorIndex en JS).
       Vive solo en dots/badges, nunca en píldoras de filtro. */
    --p0: #ff9f0a;
    --p1: #30d158;
    --p2: #0a84ff;
    --p3: #ff375f;
    --p4: #bf5af2;
    --p5: #ffd60a;
    --p6: #73daca;
    --p7: #7dcfff;
    --p8: #2ac3de;
    --p9: #c0caf5;
  }

  html[data-theme="light"] {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e2e2e5;
    --text: #16161a;
    --text-dim: #6b6b70;
    --accent: #3a5cff;
    --accent-contrast: #ffffff;
    --danger: #ff2d55;
    --success: #34c759;
    --warning: #ffcc00;

    --p0: #ff9500;
    --p1: #34c759;
    --p2: #007aff;
    --p3: #ff2d55;
    --p4: #af52de;
    --p5: #ffcc00;
    --p6: #1a7a65;
    --p7: #1573a0;
    --p8: #127a6a;
    --p9: #3d4589;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.5;
  }

  #login, #app { display: none; }

  /* ── Login screen ── */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .login-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 3rem 2.5rem;
    text-align: center;
    max-width: 340px;
    width: 100%;
  }

  .login-title {
    font-size: 1.6rem;
    font-weight: 500;
    margin: 0 0 0.75rem;
    color: var(--accent);
  }

  .login-sub {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-dim);
    margin: 0 0 2rem;
  }

  .login-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
    justify-content: center;
  }

  .login-btn:hover { background: var(--border); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ── App header ── */
  header {
    padding: 1.25rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 8px;
  }

  .app-title {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent);
    margin: 0;
  }

  .user-info {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
  }

  .theme-btn {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
    transition: color 0.12s;
  }
  .theme-btn:hover { color: var(--accent); }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--border);
  }

  .user-name {
    font-size: 13px;
    color: var(--text-dim);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .logout-btn {
    font-size: 12px;
    font-family: var(--font);
    padding: 0;
    border: none;
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.12s;
  }
  .logout-btn:hover { color: var(--accent); }

  /* ── Selector Lista/Tablero ── */
  .view-switch {
    display: flex;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 9px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }

  .view-switch-btn {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 400;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }

  .view-switch-btn.active {
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 500;
  }

  main {
    padding: 1.5rem;
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── Add book ── */
  .add-row { margin-bottom: 1rem; }

  .add-book-btn {
    width: 100%;
    height: 44px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--accent);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .add-book-btn:hover { opacity: 0.8; }

  /* ── Book form (alta/edición) ── */
  .book-form {
    display: none;
    flex-direction: column;
    gap: 12px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 1rem;
  }

  .book-form-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin: 0;
  }

  .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .form-row .form-field { flex: 1; min-width: 140px; }

  .form-field { display: flex; flex-direction: column; gap: 4px; }

  .form-field label {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font);
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: box-shadow 0.15s;
  }

  .form-field textarea { resize: vertical; min-height: 60px; }
  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus { box-shadow: 0 0 0 1.5px var(--accent); }

  .rating-input { display: flex; gap: 4px; }

  .star-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    color: var(--border);
    padding: 0;
  }
  .star-btn.filled { color: var(--accent); }

  .form-error {
    font-size: 12px;
    color: var(--danger);
    min-height: 14px;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .btn-primary {
    height: 36px;
    padding: 0 16px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.88; }

  .btn-secondary {
    height: 36px;
    padding: 0 16px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 14px;
    cursor: pointer;
    transition: color 0.12s;
  }
  .btn-secondary:hover { color: var(--text); }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 1rem;
  }

  .nav-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    border: none;
    background: var(--border);
    color: var(--text-dim);
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: opacity 0.12s;
  }
  .nav-btn:not(.active):hover { opacity: 0.7; }
  .nav-btn.active { background: var(--accent); color: var(--accent-contrast); }

  #status-filters { display: contents; }

  .sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; flex-shrink: 0; }

  /* ── Book list ── */
  .book-list { display: flex; flex-direction: column; gap: 10px; }

  .book-card {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
  }

  .book-card-main { flex: 1; min-width: 0; }

  .book-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    overflow-wrap: break-word;
  }
  .book-authors { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

  .book-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font);
  }

  .area-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    display: inline-block;
    margin-right: 6px;
  }

  .area-p0 .area-dot { background: var(--p0); }
  .area-p1 .area-dot { background: var(--p1); }
  .area-p2 .area-dot { background: var(--p2); }
  .area-p3 .area-dot { background: var(--p3); }
  .area-p4 .area-dot { background: var(--p4); }
  .area-p5 .area-dot { background: var(--p5); }
  .area-p6 .area-dot { background: var(--p6); }
  .area-p7 .area-dot { background: var(--p7); }
  .area-p8 .area-dot { background: var(--p8); }
  .area-p9 .area-dot { background: var(--p9); }

  .book-rating { color: var(--accent); font-size: 12px; letter-spacing: 1px; }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    display: inline-block;
    margin-right: 6px;
  }

  .status-pendiente .status-dot { background: var(--warning); }
  .status-leyendo .status-dot { background: var(--success); }
  .status-leido .status-dot { background: var(--danger); }

  .book-card-actions { display: flex; gap: 2px; flex-shrink: 0; }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    transition: color 0.12s;
  }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn.del-book-btn:hover { color: var(--danger); }

  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* ── Board (Kanban sobre status) ── */
  .board {
    display: none;
    gap: 16px;
    align-items: flex-start;
  }

  .board-col {
    flex-grow: 1;
    flex-shrink: 1;
    flex-basis: 0;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    border-radius: var(--radius);
    transition: background 0.15s, border-color 0.15s;
  }

  .board-col.empty-col {
    border: 1.5px dashed var(--border);
    padding: 10px;
  }

  .board.dragging-active .board-col { flex-grow: 1 !important; }

  .board-col.drag-over {
    background: var(--border);
    border-color: var(--accent);
  }

  .board-col-header {
    padding: 4px 0 10px;
    border-bottom: 0.5px solid var(--border);
    font-family: var(--font);
    font-weight: 500;
    color: var(--accent);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }

  .board-col-count { color: var(--text-dim); font-size: 11px; position: absolute; right: 0; }

  .board-col-body {
    flex: 1;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 60px;
  }

  .board-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: grab;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: opacity 0.2s;
    user-select: none;
  }
  .board-card:active { cursor: grabbing; }
  .board-card.dragging { opacity: 0.5; box-shadow: 0 0 0 2px var(--accent); }

  .board-card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    overflow-wrap: break-word;
  }
  .board-card-authors { font-size: 12px; color: var(--text-dim); }

  .board-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .board-status-select {
    font-size: 12px;
    font-family: var(--font);
    padding: 4px 6px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text-dim);
    cursor: pointer;
  }

  .board-empty {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-dim);
    font-size: 12px;
  }

  .board-dots {
    display: none;
    justify-content: center;
    gap: 7px;
    padding: 12px 0 0;
  }

  .board-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
    cursor: pointer;
  }
  .board-dot.active { background: var(--accent); }

  @media (max-width: 480px) {
    .book-card { flex-direction: column; }
    .book-card-actions { align-self: flex-end; margin-top: -8px; }
  }

  @media (max-width: 640px) {
    .board {
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      gap: 0;
      overflow-x: auto;
    }
    .board .board-col {
      flex-shrink: 0;
      width: 100%;
      scroll-snap-align: start;
    }
    .board-dots { display: flex; }
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="login-screen">
  <div class="login-card">
    <h1 class="login-title">marginaLia</h1>
    <p class="login-sub" id="login-sub">Tu bitácora de lectura personal.</p>
    <button class="login-btn" id="login-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continuar con Google
    </button>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="header-top">
      <h1 class="app-title">marginaLia</h1>
      <div class="user-info">
        <div class="view-switch" id="view-switch">
          <button class="view-switch-btn" data-view="list" type="button">Lista</button>
          <button class="view-switch-btn" data-view="board" type="button">Tablero</button>
        </div>
        <button class="theme-btn" id="theme-btn" aria-label="Cambiar tema" type="button"></button>
        <img id="user-avatar" class="avatar" src="" alt="" />
        <span class="user-name" id="user-name"></span>
        <button class="logout-btn" id="logout-btn" type="button">salir</button>
      </div>
    </div>
  </header>

  <main>
    <div class="add-row">
      <button class="add-book-btn" id="add-book-btn" type="button">+ Agregar libro</button>
    </div>

    <form class="book-form" id="book-form">
      <h2 class="book-form-title" id="book-form-title">Agregar libro</h2>

      <div class="form-field">
        <label for="book-title">Título</label>
        <input type="text" id="book-title" autocomplete="off" />
      </div>

      <div class="form-field">
        <label for="book-authors">Autores (separados por coma)</label>
        <input type="text" id="book-authors" autocomplete="off" placeholder="José Edelstein, Andrés Gomberoff" />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="book-area">Área</label>
          <input type="text" id="book-area" list="book-area-options" autocomplete="off" />
          <datalist id="book-area-options"></datalist>
        </div>
        <div class="form-field">
          <label for="book-subarea">Subárea (opcional)</label>
          <input type="text" id="book-subarea" autocomplete="off" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="book-status">Estado</label>
          <select id="book-status">
            <option value="pendiente">Pendiente</option>
            <option value="leyendo">Leyendo</option>
            <option value="leido">Leído</option>
            <option value="abandonado">Abandonado</option>
          </select>
        </div>
        <div class="form-field">
          <label for="book-priority">Prioridad</label>
          <select id="book-priority">
            <option value="curiosidad">Curiosidad</option>
            <option value="interesado">Interesado</option>
            <option value="must_have">Must-have</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label>Valoración</label>
        <div class="rating-input" id="book-rating-input"></div>
      </div>

      <div class="form-field">
        <label for="book-notes">Notas</label>
        <textarea id="book-notes"></textarea>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="book-cover">Portada (URL, opcional)</label>
          <input type="text" id="book-cover" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="book-isbn">ISBN (opcional)</label>
          <input type="text" id="book-isbn" autocomplete="off" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="book-pages">Páginas (opcional)</label>
          <input type="number" id="book-pages" min="1" />
        </div>
        <div class="form-field">
          <label for="book-started">Inicio de lectura (opcional)</label>
          <input type="date" id="book-started" />
        </div>
        <div class="form-field">
          <label for="book-finished">Fin de lectura (opcional)</label>
          <input type="date" id="book-finished" />
        </div>
      </div>

      <div class="form-error" id="book-form-error"></div>

      <div class="form-actions">
        <button class="btn-secondary" id="cancel-book-btn" type="button">Cancelar</button>
        <button class="btn-primary" type="submit">Guardar</button>
      </div>
    </form>

    <nav class="filters" id="filters">
      <span id="status-filters">
        <button class="nav-btn active" data-status="all" type="button">Todas</button>
        <button class="nav-btn" data-status="pendiente" type="button">Pendiente</button>
        <button class="nav-btn" data-status="leyendo" type="button">Leyendo</button>
        <button class="nav-btn" data-status="leido" type="button">Leído</button>
        <button class="nav-btn" data-status="abandonado" type="button">Abandonado</button>
      </span>
      <div class="sep" id="area-sep" style="display:none"></div>
      <span id="area-filters"></span>
    </nav>

    <div class="book-list" id="book-list"></div>
    <div id="board" class="board"></div>
    <div class="board-dots" id="board-dots"></div>
    <div class="empty" id="empty-state" style="display:none"></div>
  </main>
</div>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDrIMt-OByOww61cU3GwRe9HmXz-88tc0g",
  authDomain: "marginalia-68e0a.firebaseapp.com",
  projectId: "marginalia-68e0a",
  storageBucket: "marginalia-68e0a.firebasestorage.app",
  messagingSenderId: "1064022524675",
  appId: "1:1064022524675:web:c41eee84a99aa72d6a5f36"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const STATUSES = [
  { key: 'pendiente',   label: 'Pendiente' },
  { key: 'leyendo',     label: 'Leyendo' },
  { key: 'leido',       label: 'Leído' },
  { key: 'abandonado',  label: 'Abandonado' },
];

let books         = [];
let unsubBooks     = null;
let statusFilter   = 'all';
let areaFilter     = null;
let editingBookId  = null;
let formRatingValue = 0;
let viewMode           = localStorage.getItem('viewMode') || 'list';
let dragBookId         = null;
let boardDndController = null;
let dotsController      = null;

// ── Handle redirect result on page load ─────────────────────────
getRedirectResult(auth).catch(err => {
  if (err.code && err.code !== 'auth/no-auth-event') {
    console.error('Redirect error:', err.code, err.message);
    const sub = document.getElementById('login-sub');
    sub.textContent = `Error: ${err.code}`;
    sub.style.color = 'var(--danger)';
  }
});

// ── Auth state ──────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-avatar').src = user.photoURL || '';
    document.getElementById('user-name').textContent = user.displayName || user.email || '';
    startListeners(user.uid);
  } else {
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('user-avatar').src = '';
    document.getElementById('user-name').textContent = '';
    if (unsubBooks) { unsubBooks(); unsubBooks = null; }
    books = [];
    statusFilter = 'all';
    areaFilter = null;
    closeBookForm();
    render();
  }
});

function startListeners(uid) {
  if (unsubBooks) unsubBooks();
  const qBooks = query(collection(db, 'users', uid, 'books'), orderBy('createdAt'));
  unsubBooks = onSnapshot(qBooks, snap => {
    books = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

// ── Auth actions ─────────────────────────────────────────────────
async function login() {
  const provider = new GoogleAuthProvider();
  const btn = document.getElementById('login-btn');
  const sub = document.getElementById('login-sub');
  btn.disabled = true;
  sub.textContent = 'Conectando...';
  sub.style.color = '';
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    btn.disabled = false;
    if (err.code === 'auth/popup-blocked') {
      sub.textContent = 'Popup bloqueado, redirigiendo a Google...';
      await signInWithRedirect(auth, provider);
    } else if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
      sub.textContent = 'Cerraste el popup. Intentá de nuevo.';
      sub.style.color = 'var(--text-dim)';
    } else {
      sub.textContent = `Error: ${err.code}`;
      sub.style.color = 'var(--danger)';
      console.error('Login error:', err.code, err.message);
    }
  }
}

async function logout() {
  await signOut(auth);
}

// ── Book operations ────────────────────────────────────────────
function getAreaOptions() {
  return [...new Set(books.map(b => b.area).filter(Boolean))].sort((a, b) => a.localeCompare(b));
}

function areaColorIndex(area) {
  const idx = getAreaOptions().indexOf(area);
  return idx >= 0 ? idx % 10 : 0;
}

function normalizeArea(input) {
  const trimmed = input.trim();
  const existing = getAreaOptions().find(a => a.toLowerCase() === trimmed.toLowerCase());
  return existing || trimmed;
}

function parseAuthors(input) {
  return input.split(',').map(s => s.trim()).filter(Boolean);
}

function dateToTimestamp(dateStr) {
  if (!dateStr) return null;
  return new Date(dateStr + 'T00:00:00').getTime();
}

function timestampToDateInputValue(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

async function addBook(fields) {
  const user = auth.currentUser;
  if (!user) return;
  await addDoc(collection(db, 'users', user.uid, 'books'), {
    ...fields,
    createdAt: Date.now()
  });
}

async function updateBook(id, fields) {
  const user = auth.currentUser;
  if (!user) return;
  await updateDoc(doc(db, 'users', user.uid, 'books', id), fields);
}

async function deleteBook(id) {
  const user = auth.currentUser;
  if (!user) return;
  const book = books.find(b => b.id === id);
  if (!confirm(`¿Eliminar "${book ? book.title : 'este libro'}"?`)) return;
  try {
    await deleteDoc(doc(db, 'users', user.uid, 'books', id));
  } catch (err) {
    console.error('deleteBook error:', err);
  }
}

async function moveBook(id, status) {
  const book = books.find(b => b.id === id);
  if (!book || book.status === status) return;
  await updateBook(id, { status });
}

// ── Book form ───────────────────────────────────────────────────
function renderRatingInput() {
  const container = document.getElementById('book-rating-input');
  container.innerHTML = [1, 2, 3, 4, 5].map(n => `
    <button type="button" class="star-btn ${n <= formRatingValue ? 'filled' : ''}" data-value="${n}" aria-label="${n} estrella${n > 1 ? 's' : ''}">★</button>
  `).join('');
}

function renderAreaOptionsDatalist() {
  document.getElementById('book-area-options').innerHTML =
    getAreaOptions().map(a => `<option value="${escHtml(a)}"></option>`).join('');
}

function openBookForm(book) {
  editingBookId = book ? book.id : null;
  document.getElementById('book-form-title').textContent = book ? 'Editar libro' : 'Agregar libro';
  document.getElementById('book-title').value    = book ? book.title : '';
  document.getElementById('book-authors').value  = book && book.authors ? book.authors.join(', ') : '';
  document.getElementById('book-area').value     = book ? book.area : '';
  document.getElementById('book-subarea').value  = book ? (book.subarea || '') : '';
  document.getElementById('book-status').value   = book ? book.status : 'pendiente';
  document.getElementById('book-priority').value = book ? book.priority : 'curiosidad';
  document.getElementById('book-notes').value    = book ? (book.notes || '') : '';
  document.getElementById('book-cover').value    = book ? (book.cover || '') : '';
  document.getElementById('book-isbn').value     = book ? (book.isbn || '') : '';
  document.getElementById('book-pages').value    = book && book.pages ? book.pages : '';
  document.getElementById('book-started').value  = book ? timestampToDateInputValue(book.startedAt) : '';
  document.getElementById('book-finished').value = book ? timestampToDateInputValue(book.finishedAt) : '';
  document.getElementById('book-form-error').textContent = '';
  formRatingValue = book ? (book.rating || 0) : 0;
  renderRatingInput();
  renderAreaOptionsDatalist();
  document.getElementById('book-form').style.display = 'flex';
  document.getElementById('add-book-btn').style.display = 'none';
  document.getElementById('book-title').focus();
}

function closeBookForm() {
  editingBookId = null;
  formRatingValue = 0;
  document.getElementById('book-form').style.display = 'none';
  document.getElementById('add-book-btn').style.display = '';
  document.getElementById('book-form').reset();
}

async function submitBookForm(e) {
  e.preventDefault();
  const errorEl = document.getElementById('book-form-error');
  errorEl.textContent = '';

  const title    = document.getElementById('book-title').value.trim();
  const areaRaw  = document.getElementById('book-area').value.trim();

  if (!title) { errorEl.textContent = 'El título no puede estar vacío.'; return; }
  if (!areaRaw) { errorEl.textContent = 'El área no puede estar vacía.'; return; }

  const fields = {
    title,
    authors: parseAuthors(document.getElementById('book-authors').value),
    area: normalizeArea(areaRaw),
    subarea: document.getElementById('book-subarea').value.trim(),
    status: document.getElementById('book-status').value,
    priority: document.getElementById('book-priority').value,
    rating: formRatingValue,
    notes: document.getElementById('book-notes').value.trim(),
    cover: document.getElementById('book-cover').value.trim(),
    isbn: document.getElementById('book-isbn').value.trim(),
    pages: document.getElementById('book-pages').value ? Number(document.getElementById('book-pages').value) : null,
    startedAt: dateToTimestamp(document.getElementById('book-started').value),
    finishedAt: dateToTimestamp(document.getElementById('book-finished').value),
  };

  try {
    if (editingBookId) {
      await updateBook(editingBookId, fields);
    } else {
      await addBook(fields);
    }
    closeBookForm();
  } catch (err) {
    console.error('submitBookForm error:', err);
    errorEl.textContent = 'Error al guardar el libro.';
  }
}

// ── Filters + render ────────────────────────────────────────────
function getFilteredBooks() {
  return books.filter(b => {
    if (statusFilter !== 'all' && b.status !== statusFilter) return false;
    if (areaFilter && b.area !== areaFilter) return false;
    return true;
  });
}

function renderAreaFilters() {
  const areas = getAreaOptions();
  const sep = document.getElementById('area-sep');
  const container = document.getElementById('area-filters');
  if (areas.length === 0) {
    sep.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  sep.style.display = '';
  container.innerHTML = areas.map(a => `
    <button class="nav-btn ${areaFilter === a ? 'active' : ''}" data-area="${escHtml(a)}" type="button">${escHtml(a)}</button>
  `).join('');
}

function renderBookCard(b) {
  const authorsHtml = b.authors && b.authors.length
    ? `<div class="book-authors">${escHtml(b.authors.join(', '))}</div>`
    : '';
  const ratingHtml = b.rating > 0
    ? `<span class="book-rating">${'★'.repeat(b.rating)}${'☆'.repeat(5 - b.rating)}</span>`
    : '';
  const colorIdx = areaColorIndex(b.area);
  const statusLabel = STATUSES.find(s => s.key === b.status)?.label || escHtml(b.status);

  return `
    <div class="book-card">
      <div class="book-card-main">
        <div class="book-title">${escHtml(b.title)}</div>
        ${authorsHtml}
        <div class="book-meta">
          <span class="badge area-p${colorIdx}"><span class="area-dot"></span>${escHtml(b.area)}</span>
          <span class="badge status-${b.status}"><span class="status-dot"></span>${statusLabel}</span>
          ${ratingHtml}
        </div>
      </div>
      <div class="book-card-actions">
        <button class="icon-btn edit-book-btn" data-id="${b.id}" type="button" aria-label="Editar libro">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn del-book-btn" data-id="${b.id}" type="button" aria-label="Eliminar libro">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
  `;
}

function renderBookList() {
  const listEl = document.getElementById('book-list');
  const emptyEl = document.getElementById('empty-state');
  const filtered = getFilteredBooks();

  if (books.length === 0) {
    listEl.innerHTML = '';
    emptyEl.textContent = 'Todavía no cargaste ningún libro. Empezá tu bitácora con el botón de arriba.';
    emptyEl.style.display = '';
    return;
  }

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    emptyEl.textContent = 'No hay libros con estos filtros.';
    emptyEl.style.display = '';
    return;
  }

  emptyEl.style.display = 'none';
  listEl.innerHTML = filtered.map(renderBookCard).join('');
}

// ── Board (Kanban sobre status) ─────────────────────────────────
function getFilteredBooksForBoard() {
  return books.filter(b => !areaFilter || b.area === areaFilter);
}

function renderBoardCard(b) {
  const authorsHtml = b.authors && b.authors.length
    ? `<div class="board-card-authors">${escHtml(b.authors.join(', '))}</div>`
    : '';
  const colorIdx = areaColorIndex(b.area);
  const options = STATUSES.map(s => `<option value="${s.key}" ${s.key === b.status ? 'selected' : ''}>${s.label}</option>`).join('');

  return `
    <div class="board-card" draggable="true" data-id="${b.id}">
      <div class="board-card-title">${escHtml(b.title)}</div>
      ${authorsHtml}
      <div class="board-card-footer">
        <span class="badge area-p${colorIdx}"><span class="area-dot"></span>${escHtml(b.area)}</span>
        <select class="board-status-select" data-id="${b.id}" aria-label="Cambiar estado">${options}</select>
      </div>
    </div>
  `;
}

function renderBoardColumnsHtml(visible) {
  const cols = {};
  STATUSES.forEach(s => { cols[s.key] = []; });
  visible.forEach(b => { if (cols[b.status]) cols[b.status].push(b); });

  return STATUSES.map(s => {
    const items = cols[s.key];
    const isEmpty = items.length === 0;
    const cards = items.length ? items.map(renderBoardCard).join('') : `<div class="board-empty">soltá acá</div>`;
    return `
      <div class="board-col${isEmpty ? ' empty-col' : ''}" data-col-status="${s.key}">
        <div class="board-col-header">
          <span>${s.label}</span>
          <span class="board-col-count">${items.length}</span>
        </div>
        <div class="board-col-body">${cards}</div>
      </div>`;
  }).join('');
}

function renderBoard() {
  if (boardDndController) boardDndController.abort();
  if (dotsController) dotsController.abort();

  const visible = getFilteredBooksForBoard();
  const boardEl = document.getElementById('board');
  const dotsEl = document.getElementById('board-dots');

  if (!visible.length) {
    boardEl.innerHTML = `<div class="empty">${areaFilter ? `No hay libros en "${escHtml(areaFilter)}"` : 'Todavía no cargaste ningún libro. Empezá tu bitácora con el botón de arriba.'}</div>`;
    dotsEl.style.display = 'none';
    dotsEl.innerHTML = '';
    return;
  }

  dotsEl.style.display = '';
  boardEl.innerHTML = renderBoardColumnsHtml(visible);
  initBoardDnd(boardEl);
  initMobileDots(boardEl);
}

function initBoardDnd(boardEl) {
  boardDndController = new AbortController();
  const sig = boardDndController.signal;

  boardEl.addEventListener('dragstart', e => {
    const card = e.target.closest('.board-card');
    if (!card) return;
    dragBookId = card.dataset.id;
    boardEl.classList.add('dragging-active');
    requestAnimationFrame(() => card.classList.add('dragging'));
  }, { signal: sig });

  boardEl.addEventListener('dragend', e => {
    const card = e.target.closest('.board-card');
    if (card) card.classList.remove('dragging');
    boardEl.classList.remove('dragging-active');
    boardEl.querySelectorAll('.board-col').forEach(c => c.classList.remove('drag-over'));
  }, { signal: sig });

  boardEl.addEventListener('dragover', e => {
    const col = e.target.closest('.board-col');
    if (!col) return;
    e.preventDefault();
    boardEl.querySelectorAll('.board-col').forEach(c => c.classList.remove('drag-over'));
    col.classList.add('drag-over');
  }, { signal: sig });

  boardEl.addEventListener('dragleave', e => {
    const col = e.target.closest('.board-col');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  }, { signal: sig });

  boardEl.addEventListener('drop', e => {
    const col = e.target.closest('.board-col');
    if (!col || !dragBookId) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    moveBook(dragBookId, col.dataset.colStatus);
    dragBookId = null;
  }, { signal: sig });

  boardEl.addEventListener('change', e => {
    const select = e.target.closest('.board-status-select');
    if (!select) return;
    moveBook(select.dataset.id, select.value);
  }, { signal: sig });
}

function initMobileDots(boardEl) {
  const dotsEl = document.getElementById('board-dots');
  const cols = boardEl.querySelectorAll('.board-col');
  if (!cols.length) return;

  dotsEl.innerHTML = Array.from(cols).map((_, i) => `<div class="board-dot${i === 0 ? ' active' : ''}" data-col="${i}"></div>`).join('');
  const dots = dotsEl.querySelectorAll('.board-dot');

  dotsController = new AbortController();
  const sig = dotsController.signal;

  const onScroll = () => {
    const colW = cols[0].offsetWidth;
    const idx = colW ? Math.round(boardEl.scrollLeft / colW) : 0;
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  };

  boardEl.addEventListener('scroll', onScroll, { passive: true, signal: sig });
  dots.forEach((dot, i) => {
    dot.addEventListener('click', () => {
      boardEl.scrollTo({ left: i * (cols[0]?.offsetWidth || 0), behavior: 'smooth' });
    }, { signal: sig });
  });
}

// ── Vista Lista/Tablero ──────────────────────────────────────────
function setViewMode(mode) {
  viewMode = mode;
  localStorage.setItem('viewMode', viewMode);
  updateViewSwitch();
  render();
}

function updateViewSwitch() {
  document.querySelectorAll('.view-switch-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === viewMode);
  });
}

function render() {
  renderAreaFilters();

  const isBoard = viewMode === 'board';
  document.getElementById('status-filters').style.display = isBoard ? 'none' : 'contents';
  document.getElementById('book-list').style.display = isBoard ? 'none' : 'flex';
  document.getElementById('board').style.display = isBoard ? 'flex' : 'none';

  if (isBoard) {
    document.getElementById('empty-state').style.display = 'none';
    renderBoard();
  } else {
    document.getElementById('board-dots').style.display = 'none';
    renderBookList();
  }
}

// ── XSS sanitization ────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Event wiring ─────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('logout-btn').addEventListener('click', logout);

document.getElementById('add-book-btn').addEventListener('click', () => openBookForm(null));
document.getElementById('cancel-book-btn').addEventListener('click', closeBookForm);
document.getElementById('book-form').addEventListener('submit', submitBookForm);

document.getElementById('book-rating-input').addEventListener('click', e => {
  const btn = e.target.closest('.star-btn');
  if (!btn) return;
  const value = Number(btn.dataset.value);
  formRatingValue = formRatingValue === value ? 0 : value;
  renderRatingInput();
});

document.getElementById('filters').addEventListener('click', e => {
  const statusBtn = e.target.closest('[data-status]');
  if (statusBtn) { statusFilter = statusBtn.dataset.status; renderAreaAndStatusActive(); render(); return; }
  const areaBtn = e.target.closest('[data-area]');
  if (areaBtn) { areaFilter = areaFilter === areaBtn.dataset.area ? null : areaBtn.dataset.area; render(); return; }
});

function renderAreaAndStatusActive() {
  document.querySelectorAll('#filters [data-status]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === statusFilter);
  });
}

document.getElementById('book-list').addEventListener('click', e => {
  const editBtn = e.target.closest('.edit-book-btn');
  if (editBtn) {
    const book = books.find(b => b.id === editBtn.dataset.id);
    if (book) openBookForm(book);
    return;
  }
  const delBtn = e.target.closest('.del-book-btn');
  if (delBtn) { deleteBook(delBtn.dataset.id); return; }
});

document.querySelectorAll('.view-switch-btn').forEach(btn => {
  btn.addEventListener('click', () => setViewMode(btn.dataset.view));
});
updateViewSwitch();

// ── Theme toggle ─────────────────────────────────────────────────
const SUN  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function updateThemeBtn() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.getElementById('theme-btn').innerHTML = isDark ? SUN : MOON;
}

function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeBtn();
}

updateThemeBtn();
document.getElementById('theme-btn').addEventListener('click', toggleTheme);

// Estado inicial (sin sesión, sin libros)
renderRatingInput();
render();
</script>

</body>
